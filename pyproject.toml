[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "get-shredded"
version = "0.1.0"
description = "Sparse-sensor reconstruction (SHRED and variants) under sensor faults"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "hydra-core>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "tqdm>=4.66",
  "ipywidgets>=8.1.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
]
