# Entry config for scripts/run.py. Pick an experiment with +experiment=<name>:
#   uv run python scripts/run.py +experiment=dropout_baseline
#   uv run python scripts/run.py +experiment=dropout_baseline data=wave train.epochs=20 eval.seeds=[0]
# Protocol choices and their rationale: docs/protocol.md.
defaults:
  - data: nektar_uv
  # Every method and corruption is loaded under a name; experiments refer to them in `runs`.
  - method@methods.shred: shred
  - method@methods.shred_mask: shred_mask
  - method@methods.sdn: sdn
  - method@methods.robust_shred_v1: robust_shred_v1
  - method@methods.robust_shred_v2: robust_shred_v2
  - method@methods.senseiver_sdn: senseiver_sdn
  - method@methods.gappy_pod: gappy_pod
  - method@methods.pod_shred: pod_shred
  - method@methods.pod_trunk_shred: pod_trunk_shred
  - method@methods.trunk_shred: trunk_shred
  - method@methods.trunk_shred_pinn: trunk_shred_pinn
  - method@methods.trunk_shred_noff: trunk_shred_noff
  - method@methods.trunk_shred_ff8: trunk_shred_ff8
  - method@methods.trunk_shred_pinn_strong: trunk_shred_pinn_strong
  - method@methods.trunk_shred_pinn_weak: trunk_shred_pinn_weak
  - method@methods.trunk_shred_probes: trunk_shred_probes
  - method@methods.trunk_shred_pinn_probes: trunk_shred_pinn_probes
  - method@methods.trunk_shred_pinn_weak_probes: trunk_shred_pinn_weak_probes
  - method@methods.trunk_shred_pinn_strong_probes: trunk_shred_pinn_strong_probes
  - method@methods.flow_trunk_shred: flow_trunk_shred
  - method@methods.flow_trunk_shred_div: flow_trunk_shred_div
  - method@methods.flow_trunk_shred_div_strong: flow_trunk_shred_div_strong
  - method@methods.flow_trunk_shred_div_weak: flow_trunk_shred_div_weak
  - method@methods.flow_trunk_shred_w128: flow_trunk_shred_w128
  - method@methods.flow_trunk_shred_w256: flow_trunk_shred_w256
  - method@methods.flow_trunk_shred_ff32: flow_trunk_shred_ff32
  - method@methods.flow_trunk_shred_w256_ff32: flow_trunk_shred_w256_ff32
  - method@methods.flow_trunk_shred_cos: flow_trunk_shred_cos
  - method@methods.flow_trunk_shred_w256_cos: flow_trunk_shred_w256_cos
  - method@methods.flow_trunk_shred_w256_cos_lr3: flow_trunk_shred_w256_cos_lr3
  - corruption@corruptions.clean: clean
  - corruption@corruptions.noise: noise
  - corruption@corruptions.missing: missing
  - corruption@corruptions.garbage: garbage
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

name: scratch               # experiment name; outputs go to <outputs_root>/<name>/<data.name>/
outputs_root: outputs
verbose: false              # true: raise on the first failed run instead of recording it
device: cpu                 # auto (cuda > mps > cpu) | cpu | mps | cuda; not in the fingerprint. speed_benchmark: CPU 4.5x MPS
jobs: 6                     # worker processes, each trains one (seed, run) at a time; 1 = serial in this process
threads: 1                  # torch threads per worker (jobs > 1 only)

sensors:
  num: 8
  rank: 16                  # POD rank for block-QR placement and gappy POD (2 x num)
  # placement: qr | random | explicit (+ locations: [grid points]); unset = qr. Not set here: sensors is fingerprinted
noise_frac: 0.05            # sigma = noise_frac x per-channel training std (unscaled)
wave_input:                 # replacement input series for runs with input: wave_input (decoupling test)
  file: data/wave_1d.npz
  trajectory_index: 1

train:
  epochs: 1000
  batch_size: 64
  lr: 1.0e-3
  patience: 5

eval:
  seeds: [0, 1, 2]
  split: test               # test | valid: windows to evaluate on (valid: overnight tuning only, see docs/protocol.md)
  draws: 10                 # fixed noise/fault realisations per test window
  panel_windows: 4          # test windows whose reconstructions are stored
  # corruption (a key of `corruptions`) x flags x severity: `ks` = exactly k probes faulty
  # (`all` = 0..N-1), or `ps` = each probe faulty with probability p
  conditions:
    - {corruption: missing, flags: oracle, ks: all}

runs: []                    # [{method: <key of methods>, train: <key of corruptions>}, ...]
