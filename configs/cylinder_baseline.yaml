defaults:
  - default
  - noise: disabled
  - _self_

data:
  mat: data/CYLINDER_ALL.mat
  test_size: 10           # last `test_size` windows held out (sequential split)
  val_size: 20            # last `val_size` windows of the remainder used for validation

model:
  num_sensors: 3
  lags: 10                # cylinder data is short (~150 snapshots)
  placement: QR           # "QR" or "random"
  recurrent_cell: gru     # "gru" or "lstm"
  hidden_size: 64
  hidden_layers: 2
  l1: 350
  l2: 400
  dropout: 0.0

senseiver:
  enabled: false
  sdn_enabled: true
  num_latents: 8
  latent_dim: 32
  num_frequencies: 8
  num_heads: 4
  dropout: 0.0
  sdn_l1: 350
  sdn_l2: 400

robust_shred:
  v1_enabled: true
  v2_enabled: true
  hidden_size: 64
  hidden_layers: 2
  num_heads: 4
  embed_dim: 32
  num_latents: 8
  latent_dim: 32
  num_frequencies: 8
  l1: 350
  l2: 400
  dropout: 0.0

train:
  epochs: 1000
  batch_size: 64
  lr: 1.0e-3
  patience: 5

checkpoint:
  enabled: true
  dir: models
  name: shred_baseline.pt

outputs:
  root: outputs/cylinder
  gif_fps: 4

seed: 42
