# @package _global_
# Trains the one new checkpoint residual_flags needs: v1 on garbage with half the faults flagged.
# Same data, sensors, conditions and draws as random_readings, so its test numbers compare directly.
# record: experiments/residual_flags/README.md
name: residual_flags_train
device: mps   # same device as the random_readings checkpoints it is compared with
jobs: 3
runs:
  - {method: robust_shred_v1, train: garbage_mixed}
eval:
  conditions:               # copied from random_readings (masks are drawn in condition order)
    - {corruption: missing, flags: oracle, ps: [0.0, 0.3]}
    - {corruption: garbage, flags: oracle, ps: [0.3]}
    - {corruption: garbage, flags: silent, ps: [0.3]}
    - {corruption: missing, flags: oracle, ks: all}
    - {corruption: garbage, flags: oracle, ks: all}
    - {corruption: garbage, flags: silent, ks: all}
