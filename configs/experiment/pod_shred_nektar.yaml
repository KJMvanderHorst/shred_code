# @package _global_
# Does SHRED do better, or train faster, predicting POD coefficients instead of the full field, and does the loss
# space (decoded field vs MinMax-scaled coefficients, as in masked-shred) matter? Clean, standard protocol.
# pod_trunk_shred*: the POD modes as a continuous trunk (Nektar only), frozen or trained, with and without continuity.
# record: experiments/pod_shred_nektar/README.md
#   uv run python scripts/run.py +experiment=pod_shred_nektar
defaults:
  - /method@methods.pod_shred_r32: pod_shred
  - /method@methods.pod_shred_r64: pod_shred
  - /method@methods.pod_shred_coef_r16: pod_shred
  - /method@methods.pod_shred_coef_r32: pod_shred
  - /method@methods.pod_shred_coef_r64: pod_shred
  - /method@methods.pod_trunk_shred_coef: pod_trunk_shred
  - /method@methods.pod_trunk_shred_div: pod_trunk_shred
  - /method@methods.pod_trunk_shred_train: pod_trunk_shred
  - /method@methods.pod_trunk_shred_train_div: pod_trunk_shred
name: pod_shred_nektar
methods:
  pod_shred_r32: {rank: 32}
  pod_shred_r64: {rank: 64}
  pod_shred_coef_r16: {rank: 16, loss_space: coef}
  pod_shred_coef_r32: {rank: 32, loss_space: coef}
  pod_shred_coef_r64: {rank: 64, loss_space: coef}
  pod_trunk_shred_coef: {loss_space: coef}
  pod_trunk_shred_div: {physics_weight: 1.0e-3}
  pod_trunk_shred_train: {train_trunk: true}                            # trunk keeps training (run's lr)
  pod_trunk_shred_train_div: {train_trunk: true, physics_weight: 1.0e-3}
runs:
  - {method: shred, train: clean}               # full field (10 000 outputs on Nektar)
  - {method: pod_shred, train: clean}           # r = 16 per field, loss on the decoded field
  - {method: pod_shred_r32, train: clean}
  - {method: pod_shred_r64, train: clean}
  - {method: pod_shred_coef_r16, train: clean}  # loss and early stopping on the scaled coefficients
  - {method: pod_shred_coef_r32, train: clean}
  - {method: pod_shred_coef_r64, train: clean}
  - {method: pod_trunk_shred, train: clean}       # r = 16 modes as a frozen continuous trunk, field loss
  - {method: pod_trunk_shred_coef, train: clean}  # coefficient loss, trunk only reconstructs
  - {method: pod_trunk_shred_div, train: clean}   # field loss + continuity, lambda 1e-3
  - {method: pod_trunk_shred_train, train: clean}      # trunk trainable, field loss: unfreezing alone
  - {method: pod_trunk_shred_train_div, train: clean}  # trunk trainable, field loss + continuity: physics can reshape it
eval:
  conditions:
    - {corruption: clean, flags: oracle, ps: [0.0]}
