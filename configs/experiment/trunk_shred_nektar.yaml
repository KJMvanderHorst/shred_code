# @package _global_
# Does the DeepONet-style trunk SHRED train on the Nektar (u, v) wake, and what does a continuity loss change?
# Regime A: standard protocol (1000 epochs, early stopping). Regime B: trunk_shred_nektar_5k.
# Nektar only (flow_trunk_shred raises on other data). record: experiments/trunk_shred_nektar/README.md
#   uv run python scripts/run.py +experiment=trunk_shred_nektar
name: trunk_shred_nektar
runs:
  - {method: shred, train: clean}
  - {method: flow_trunk_shred_w256_cos_lr3, train: clean}   # trunk: width 256, p 128, cosine lr from 3e-3
  - {method: flow_trunk_shred_div_weak, train: clean}       # + continuity, lambda 1e-4
  - {method: flow_trunk_shred_div, train: clean}            # lambda 1e-3
  - {method: flow_trunk_shred_div_strong, train: clean}     # lambda 1e-2
# Seed-0 search that picked the trunk (results in outputs/trunk_shred_nektar, notebooks/trunk_shred_nektar.ipynb):
#   uv run python scripts/run.py +experiment=trunk_shred_nektar 'eval.seeds=[0]' 'runs=[<one of these>]'
#   flow_trunk_shred (64 wide, p 64), flow_trunk_shred_w128, flow_trunk_shred_w256, flow_trunk_shred_ff32,
#   flow_trunk_shred_w256_ff32, flow_trunk_shred_cos, flow_trunk_shred_w256_cos, flow_trunk_shred_w256_cos_lr3
eval:
  conditions:
    - {corruption: clean, flags: oracle, ps: [0.0]}
