defaults:
  - default
  - noise: disabled
  - _self_

data:
  mat: data/CYLINDER_ALL.mat
  test_size: 10
  val_size: 20

model:
  num_sensors: 3
  lags: 10
  placement: QR
  recurrent_cell: gru
  hidden_size: 64
  hidden_layers: 2
  l1: 350
  l2: 400
  dropout: 0.0

train:
  epochs: 1000
  batch_size: 64
  lr: 1.0e-3
  patience: 5

comparison:
  cells: [gru, lstm]
  shred_only: true
  output_dir: outputs/cylinder/recurrent_cell

outputs:
  root: outputs/cylinder/recurrent_cell

seed: 42
