defaults:
  - default
  - noise: disabled
  - _self_

data:
  source: wave
  mat: data/CYLINDER_ALL.mat
  wave_file: data/wave_1d.npz
  trajectory_index: 0
  test_size: 10
  val_size: 20

model:
  num_sensors: 3
  lags: 10
  placement: QR
  recurrent_cell: gru
  hidden_size: 64
  hidden_layers: 2
  l1: 350
  l2: 400
  dropout: 0.0

senseiver:
  enabled: false
  sdn_enabled: true
  num_latents: 8
  latent_dim: 32
  num_frequencies: 8
  num_heads: 4
  dropout: 0.0
  sdn_l1: 350
  sdn_l2: 400

robust_shred:
  v1_enabled: true
  v2_enabled: true
  hidden_size: 64
  hidden_layers: 2
  num_heads: 4
  embed_dim: 32
  num_latents: 8
  latent_dim: 32
  num_frequencies: 8
  l1: 350
  l2: 400
  dropout: 0.0

train:
  epochs: 1000
  batch_size: 64
  lr: 1.0e-3
  patience: 5

checkpoint:
  enabled: true
  dir: models
  name: wave_baseline.pt

outputs:
  root: outputs/wave
  gif_fps: 4

seed: 42
